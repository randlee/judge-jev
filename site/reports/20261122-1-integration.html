    &lt;dt&gt;Command and selected cases&lt;/dt&gt;&lt;dd&gt;&lt;pre&gt;Fresh Python 3.14 venv; install checksum-verified 0.3.3 wheel with pip --no-index --no-deps. Render/install the judge-jev plugin in a scratch git repository. Run python jev_judge.py quality --req REQ-T-0001 --index index.json --run-name live-quality using test_quality.INDEX; run python jev_judge.py batch --input batch.jsonl --run-name live-batch --repeat 1 using BatchTests.LINES plus the prior integration s4-style line (4 requests). Run both with exported environment credential and again with default keychain. Run batch four times with an invalid credential. Run pytest test_decidr_client.py -k sitr and direct sitr extraction. SC_PROJECT=judge-jev-integration. No keychain overrides; no test changed HOME or USERPROFILE.&lt;/pre&gt;&lt;/dd&gt;
    &lt;dt&gt;Outcome&lt;/dt&gt;&lt;dd&gt;PARTIAL / FAIL: 6 of 8 live cases passed; 2 default-keychain cases failed. All 4 sitr checks passed.&lt;/dd&gt;
    &lt;dt&gt;Evidence and failures&lt;/dt&gt;&lt;dd&gt;&lt;pre&gt;Environment credential: quality exit 0, success true and dry_run false; two statements judged. Batch exit 0, four real result lines, all ok. Default keychain: quality exit 2, AUTH.CREDENTIALS, &amp;quot;timed out waiting on channel&amp;quot;; batch exit 2, four failed result lines and stderr AUTH.CREDENTIALS with the same message. Invalid credential: four batch runs exit 2 and report AUTH.CREDENTIALS; each returns four failed auth/canceled result lines. sitr: pytest 3 passed, direct extraction returned one capture. The recorded quality request is the existing test_quality.INDEX case REQ-T-0001; the previous historical REQ-JEV-0101 Raptor index was not available in this checkout and was not fabricated. Scratch runtime and logs were scanned for exported credential values: zero matches.&lt;/pre&gt;&lt;/dd&gt;
