  &lt;dl&gt;
    &lt;dt&gt;Platform&lt;/dt&gt;&lt;dd&gt;macos (Darwin 25.5.0, arm64)&lt;/dd&gt;

    &lt;dt&gt;sc-agent version&lt;/dt&gt;&lt;dd&gt;sc-decidr 0.2.5 and sitr 0.2.5 prerelease wheels, prerelease/v0.2.5 @ 9977683fbac00e48d442601fe39e9e98c9fe52af, cp311-abi3-macosx_11_0_arm64, sha256 verified against checksums.txt (not on PyPI; resolved with UV_FIND_LINKS)&lt;/dd&gt;

    &lt;dt&gt;Command and selected cases&lt;/dt&gt;&lt;dd&gt;&lt;pre&gt;Installed with: uv run plugins/sc-judge-jev/install.py --dest &amp;lt;checkout&amp;gt; --allow-remote-judge --target claude
Index: raptor integration/judge-jev @ 8ce2be8, scripts/extract.py (33 records, 1 diagnostic on REQ-JEV-0003)
J=.claude/skills/judge-jev/scripts/jev_judge.py; UV_FIND_LINKS=&amp;lt;verified wheel dir&amp;gt;
1. quality: uv run --script $J quality --req REQ-JEV-0101 --index index.json --run-dir &amp;lt;dir&amp;gt;
2. batch (test_jev_batch BatchTests.LINES plus one line: 3 items, 4 requests): uv run --script $J batch --run-dir &amp;lt;dir&amp;gt; &amp;lt; batch.jsonl
3. invalid key: TYPESAFE_API_KEY=&amp;lt;invalid&amp;gt; uv run --script $J batch --run-dir &amp;lt;dir&amp;gt; &amp;lt; batch.jsonl (4 runs)
Credentials: cases 1-3 with TYPESAFE_API_KEY in the process environment, read from the owner export (scripts/integration.py --export-env), SC_AGENT_TEST_TRAP_PLATFORM_KEYRING=1 set; then cases 1-2 again with sc-agent default lookup (no env, no .env, platform keychain entry TYPESAFE_API_KEY / OS user).&lt;/pre&gt;&lt;/dd&gt;
    &lt;dt&gt;Outcome&lt;/dt&gt;&lt;dd&gt;PASS. Live quality and live batch pass with both credential paths, including the default platform-keychain lookup that failed on 0.2.2; invalid-key runs exit 2 with no crash in 8 of 8 runs (0.2.2 segfaulted in 2 of 4). The one defect found at 4f19d33 (the invalid-key summary named a cancelled request, CANCELED, instead of AUTH.CREDENTIALS in 3 of 4 runs) was fixed by #102 and re-run live at 0c1ba03: AUTH.CREDENTIALS in 4 of 4 runs.&lt;/dd&gt;
    &lt;dt&gt;Evidence and failures&lt;/dt&gt;&lt;dd&gt;&lt;pre&gt;PASS 1 quality, env credential: exit 0, success true, REQ-JEV-0101 verdict yes.
PASS 1 quality, default keychain lookup: exit 0, success true, REQ-JEV-0101 verdict yes.
PASS 2 batch, both credential paths: exit 0, 4 answered result lines, ok true each (written in completion order; order is not required).
PASS 3 invalid key: exit 2 in 4 of 4 runs, no segfault; every run has an AUTH.CREDENTIALS result line and the remaining lines CANCELED (abort_on auth).
FAIL 3 summary: the stderr error is CANCELED in runs 1, 3, 4 and AUTH.CREDENTIALS in run 2; main() reports failed[0] by position, so the auth cause is hidden when the auth failure is not the first request.
Key redacted in every output; the export file was deleted after the runs.
PASS 3 re-run at 0c1ba03 after #102: 4 invalid-key runs, exit 2 each, stderr summary AUTH.CREDENTIALS in 4 of 4.&lt;/pre&gt;&lt;/dd&gt;
