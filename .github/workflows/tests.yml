name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # The floor is CPython 3.11: judge-jev's design floor, with wheels for
        # 3.11 or newer. Keep it on 24.04 while current interpreters follow latest.
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-latest
            python: "3.x"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.x"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.x"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "jsonschema>=4,<5" "pyyaml>=5.1" "sc-observability==1.5.0"
      - run: python scripts/install_sc_compose_ci.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python -m unittest discover -v -s tests/sc-judge-jev
      - run: python scripts/check_version_sync.py
      - if: github.event_name == 'pull_request'
        run: python scripts/check_version_sync.py --base origin/${{ github.base_ref }}

  dependency-floor:
    # Proves the scripts work without PyYAML (settings tests skip with a
    # reason) and that settings reading works on the PyYAML floor. CPython
    # 3.11 is the floor (judge-jev's design floor).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "jsonschema>=4,<5" "sc-observability==1.5.0"
      - run: python scripts/install_sc_compose_ci.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: suite without PyYAML
        run: python -m unittest discover -v -s tests/sc-judge-jev
      - run: python -m pip install "pyyaml==5.1"
      - name: suite on the PyYAML floor
        run: python -m unittest discover -v -s tests/sc-judge-jev

  installer:
    # sc-compose 1.7.0 publishes CPython 3.11 wheels; the rendering and install
    # tests need it and fail here instead of skipping.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      JUDGE_JEV_REQUIRE_SC_COMPOSE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install "jsonschema>=4,<5" "pyyaml>=5.1" "sc-compose>=1.7.0,<2" "sc-observability==1.5.0"
      - run: python scripts/install_sc_compose_ci.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/gen_install_data.py --check
      - run: python -m unittest discover -v -s tests/sc-judge-jev
